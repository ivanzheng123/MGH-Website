        <script>
            /* Browsers supported: chrome 135+ */
            const browserInfo = navigator.userAgent.toLowerCase();
            const index = browserInfo.indexOf("chrome");
            const version = parseInt(browserInfo.substring(index + 7)); //Assumes chrome
            const supported = index !== -1 && version >= 135;
            if (supported) {
                console.log("Browser is Supported (Chrome 135+)");
            } else {
                alert("Your Browser is Not Supported!\n(Only Chrome 135+ is Supported)");
                console.log("Browser is not Supported (Need: Chrome 135+)");
            }
        </script>
